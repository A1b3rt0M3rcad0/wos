components:
  parameters:
    NamespaceID:
      name: namespace_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    OutcomeID:
      name: outcome_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    ObjectiveID:
      name: objective_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    WorkItemID:
      name: work_item_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    RelationID:
      name: relation_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    IssueID:
      name: issue_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    BlockerID:
      name: blocker_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    ArtifactID:
      name: artifact_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    EvidenceID:
      name: evidence_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    EvidenceLinkID:
      name: evidence_link_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    DecisionID:
      name: decision_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    RoadmapID:
      name: roadmap_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    RoadmapRevisionNumber:
      name: revision_number
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    RoadmapScopeKind:
      name: scope_kind
      in: path
      required: true
      schema:
        type: string
        enum: [outcome, objective]
    RoadmapScopeID:
      name: scope_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Strong ETag of the persisted aggregate, for example
        "work_item:0199e100-0000-7000-8000-000000000001:v5".
        Either If-Match or expected_version in the body is required for
        versioned mutations. If both are present they must agree.
      schema: {type: string}
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema: {type: string}

  requestBodies:
    VersionBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VersionRequest"
    ReasonBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReasonRequest"
    CriterionBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CriterionRequest"

  responses:
    OutcomeMutation:
      description: Outcome mutation confirmed or replayed.
      headers:
        ETag:
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OutcomeMutationResult"
    BadRequest:
      description: Invalid request, identifier, JSON or header format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found in the explicit Namespace/Outcome scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Lifecycle, lease, criterion or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated principal lacks the required privileged permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PreconditionFailed:
      description: Persisted version did not satisfy the supplied precondition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PreconditionRequired:
      description: A required If-Match or expected_version precondition is absent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Request format is valid but a domain invariant is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ID:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Version:
      type: integer
      minimum: 1
    Priority:
      type: string
      enum: [critical, high, normal, low]
    OutcomeLifecycle:
      type: string
      enum: [draft, active, achieved, failed, abandoned]
    ObjectiveLifecycle:
      type: string
      enum: [planned, in_progress, achieved, cancelled]
    WorkItemLifecycle:
      type: string
      enum: [backlog, todo, in_progress, done, cancelled]
    RelationLifecycle:
      type: string
      enum: [active, removed]
    DependencyStrength:
      type: string
      enum: [hard, advisory]
    DependencySatisfaction:
      type: string
      enum: [target_completed]
    IssueSeverity:
      type: string
      enum: [critical, major, minor, informational]
    IssueLifecycle:
      type: string
      enum: [open, investigating, resolved, wont_fix, duplicate]
    BlockerLifecycle:
      type: string
      enum: [active, resolved, cancelled]
    BlockerPropagation:
      type: string
      enum: [direct, subtree]


    ArtifactLifecycle:
      type: string
      enum: [registered, withdrawn]
    EvidenceType:
      type: string
      enum: [measurement, test_result, inspection, attestation, source, external_evaluation]
    EvidenceLifecycle:
      type: string
      enum: [registered, retracted]
    EvidenceStance:
      type: string
      enum: [supports, contradicts, context]
    EvidenceLinkLifecycle:
      type: string
      enum: [active, retracted]
    DecisionLifecycle:
      type: string
      enum: [proposed, accepted, rejected, superseded]

    DocumentaryTargetRefRequest:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [outcome, objective, work_item, issue, decision]
        id: {$ref: "#/components/schemas/ID"}

    SourceReference:
      type: object
      additionalProperties: false
      required: [provider]
      anyOf:
        - required: [id]
        - required: [uri]
      properties:
        provider: {type: string}
        id: {type: string}
        uri: {type: string}
        display_name: {type: string}

    Measurement:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: {type: string}
        unit: {type: string}
        method: {type: string}
        conditions: {type: string}

    RegisterArtifactRequest:
      type: object
      additionalProperties: false
      required: [artifact_type, name, uri]
      properties:
        artifact_type: {type: string}
        name: {type: string}
        uri:
          type: string
          description: Opaque external reference. WOS does not dereference it.
        media_type: {type: string}
        checksum: {type: string}
        source_version: {type: string}
        produced_at: {type: string, format: date-time}

    RegisterEvidenceRequest:
      type: object
      additionalProperties: false
      required: [evidence_type, description, source_ref, captured_at]
      properties:
        evidence_type: {$ref: "#/components/schemas/EvidenceType"}
        description: {type: string}
        source_ref: {$ref: "#/components/schemas/SourceReference"}
        captured_at: {type: string, format: date-time}
        artifact_id: {$ref: "#/components/schemas/ID"}
        measurement: {$ref: "#/components/schemas/Measurement"}
        source_version: {type: string}
        checksum: {type: string}

    CreateEvidenceLinkRequest:
      type: object
      additionalProperties: false
      required: [evidence_id, target_ref, stance, rationale]
      properties:
        evidence_id: {$ref: "#/components/schemas/ID"}
        target_ref: {$ref: "#/components/schemas/DocumentaryTargetRefRequest"}
        criterion_id: {$ref: "#/components/schemas/ID"}
        stance: {$ref: "#/components/schemas/EvidenceStance"}
        rationale: {type: string}

    ProposeDecisionRequest:
      type: object
      additionalProperties: false
      required: [title, proposal]
      properties:
        title: {type: string}
        proposal: {type: string}
        alternatives:
          type: array
          items: {type: string}
        chosen_alternative: {type: string}
        rationale: {type: string}

    UpdateDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        proposal: {type: string}
        alternatives:
          type: array
          items: {type: string}
        chosen_alternative: {type: string}
        rationale: {type: string}

    SupersedeDecisionRequest:
      type: object
      additionalProperties: false
      required: [title, proposal, rationale]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        proposal: {type: string}
        alternatives:
          type: array
          items: {type: string}
        chosen_alternative: {type: string}
        rationale: {type: string}

    Artifact:
      type: object
      required: [id, scope, version, artifact_type, name, uri, producer_ref, registered_at, lifecycle, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        scope: {type: object}
        version: {$ref: "#/components/schemas/Version"}
        artifact_type: {type: string}
        name: {type: string}
        uri: {type: string}
        media_type: {type: string}
        checksum: {type: string}
        source_version: {type: string}
        producer_ref: {$ref: "#/components/schemas/ActorRef"}
        produced_at: {type: string, format: date-time}
        registered_at: {type: string, format: date-time}
        lifecycle: {$ref: "#/components/schemas/ArtifactLifecycle"}
        withdrawal_reason: {type: string}
        withdrawn_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Evidence:
      type: object
      required: [id, scope, version, evidence_type, description, source_ref, producer_ref, captured_at, registered_at, lifecycle, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        scope: {type: object}
        version: {$ref: "#/components/schemas/Version"}
        evidence_type: {$ref: "#/components/schemas/EvidenceType"}
        description: {type: string}
        source_ref: {$ref: "#/components/schemas/SourceReference"}
        producer_ref: {$ref: "#/components/schemas/ActorRef"}
        captured_at: {type: string, format: date-time}
        registered_at: {type: string, format: date-time}
        artifact_id: {$ref: "#/components/schemas/ID"}
        measurement: {$ref: "#/components/schemas/Measurement"}
        source_version: {type: string}
        checksum: {type: string}
        lifecycle: {$ref: "#/components/schemas/EvidenceLifecycle"}
        retraction_reason: {type: string}
        retracted_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    EvidenceLink:
      type: object
      required: [id, scope, version, evidence_id, target_ref, stance, rationale, lifecycle, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        scope: {type: object}
        version: {$ref: "#/components/schemas/Version"}
        evidence_id: {$ref: "#/components/schemas/ID"}
        target_ref: {type: object}
        criterion_id: {$ref: "#/components/schemas/ID"}
        stance: {$ref: "#/components/schemas/EvidenceStance"}
        rationale: {type: string}
        lifecycle: {$ref: "#/components/schemas/EvidenceLinkLifecycle"}
        retraction_reason: {type: string}
        retracted_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Decision:
      type: object
      required: [id, scope, version, title, proposal, alternatives, lifecycle, proposed_by, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        scope: {type: object}
        version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        proposal: {type: string}
        chosen_alternative: {type: string}
        rationale: {type: string}
        alternatives:
          type: array
          items: {type: string}
        lifecycle: {$ref: "#/components/schemas/DecisionLifecycle"}
        proposed_by: {$ref: "#/components/schemas/ActorRef"}
        decided_by: {$ref: "#/components/schemas/ActorRef"}
        decided_at: {type: string, format: date-time}
        rejection_reason: {type: string}
        supersedes_decision_id: {$ref: "#/components/schemas/ID"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    ArtifactReadResult:
      type: object
      required: [value, outcome_revision]
      properties:
        value: {$ref: "#/components/schemas/Artifact"}
        outcome_revision: {type: integer, minimum: 1}
    EvidenceReadResult:
      type: object
      required: [value, outcome_revision]
      properties:
        value: {$ref: "#/components/schemas/Evidence"}
        outcome_revision: {type: integer, minimum: 1}
    EvidenceLinkReadResult:
      type: object
      required: [value, outcome_revision]
      properties:
        value: {$ref: "#/components/schemas/EvidenceLink"}
        outcome_revision: {type: integer, minimum: 1}
    DecisionReadResult:
      type: object
      required: [value, outcome_revision]
      properties:
        value: {$ref: "#/components/schemas/Decision"}
        outcome_revision: {type: integer, minimum: 1}

    ArtifactMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/Artifact"}
    EvidenceMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/Evidence"}
    EvidenceLinkMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/EvidenceLink"}
    DecisionMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/Decision"}
    DecisionSupersession:
      type: object
      required: [successor, predecessor]
      properties:
        successor: {$ref: "#/components/schemas/Decision"}
        predecessor: {$ref: "#/components/schemas/Decision"}
    DecisionSupersessionMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/DecisionSupersession"}

    ArtifactCollection:
      type: object
      required: [items, outcome_revision]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Artifact"}
        outcome_revision: {type: integer, minimum: 1}
    EvidenceCollection:
      type: object
      required: [items, outcome_revision]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Evidence"}
        outcome_revision: {type: integer, minimum: 1}
    EvidenceLinkCollection:
      type: object
      required: [items, outcome_revision]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/EvidenceLink"}
        outcome_revision: {type: integer, minimum: 1}
    DecisionCollection:
      type: object
      required: [items, outcome_revision]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Decision"}
        outcome_revision: {type: integer, minimum: 1}

    EntityRefRequest:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [outcome, objective, work_item, issue, blocker, relation]
        id: {$ref: "#/components/schemas/ID"}

    RoadmapPlanScope:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [outcome, objective]
        id: {$ref: "#/components/schemas/ID"}

    RoadmapEntityRef:
      type: object
      additionalProperties: false
      required: [namespace_id, outcome_id, kind, id]
      properties:
        namespace_id: {$ref: "#/components/schemas/ID"}
        outcome_id: {$ref: "#/components/schemas/ID"}
        kind:
          type: string
          enum: [outcome, objective, work_item]
        id: {$ref: "#/components/schemas/ID"}

    RoadmapCriterionRef:
      type: object
      required: [owner_ref, criterion_id]
      properties:
        owner_ref: {$ref: "#/components/schemas/RoadmapEntityRef"}
        criterion_id: {$ref: "#/components/schemas/ID"}

    RoadmapCriterionSnapshot:
      type: object
      required: [owner_ref, criterion_id, criterion_revision, title, required, verification_mode]
      properties:
        owner_ref: {$ref: "#/components/schemas/RoadmapEntityRef"}
        criterion_id: {$ref: "#/components/schemas/ID"}
        criterion_revision: {type: integer, minimum: 1}
        title: {type: string}
        required: {type: boolean}
        verification_mode:
          type: string
          enum: [attestation, evidence_review, external_evaluation]

    RoadmapReferenceSnapshot:
      type: object
      required: [target_ref, title]
      properties:
        target_ref: {$ref: "#/components/schemas/RoadmapEntityRef"}
        title: {type: string}

    RoadmapNode:
      type: object
      required: [node_key, node_type, title, position]
      properties:
        node_key: {type: string}
        node_type:
          type: string
          enum: [reference, phase, milestone]
        parent_node_key: {type: string}
        target_ref: {$ref: "#/components/schemas/RoadmapEntityRef"}
        title: {type: string}
        position: {type: integer, minimum: 0}
        criterion_refs:
          type: array
          items: {$ref: "#/components/schemas/RoadmapCriterionRef"}
        criterion_snapshots:
          type: array
          readOnly: true
          items: {$ref: "#/components/schemas/RoadmapCriterionSnapshot"}
        planned_start: {type: string, format: date-time}
        planned_end: {type: string, format: date-time}
        published_reference_snapshot:
          allOf:
            - $ref: "#/components/schemas/RoadmapReferenceSnapshot"
          readOnly: true

    RoadmapAfterLink:
      type: object
      required: [node_key, after_node_key]
      properties:
        node_key: {type: string}
        after_node_key: {type: string}

    RoadmapDependencySnapshot:
      type: object
      readOnly: true
      required: [dependent_ref, prerequisite_ref, strength, satisfaction]
      properties:
        dependent_ref: {$ref: "#/components/schemas/RoadmapEntityRef"}
        prerequisite_ref: {$ref: "#/components/schemas/RoadmapEntityRef"}
        strength: {$ref: "#/components/schemas/DependencyStrength"}
        satisfaction:
          type: string
          enum: [target_completed]

    RoadmapDraft:
      type: object
      required: [draft_version, lifecycle, nodes, after_links, created_at, updated_at]
      properties:
        draft_version: {type: integer, minimum: 1}
        base_revision_number: {type: integer, minimum: 1}
        lifecycle:
          type: string
          enum: [open, discarded]
        nodes:
          type: array
          items: {$ref: "#/components/schemas/RoadmapNode"}
        after_links:
          type: array
          items: {$ref: "#/components/schemas/RoadmapAfterLink"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        discarded_at: {type: string, format: date-time}

    RoadmapRevision:
      type: object
      readOnly: true
      required: [revision_number, content_hash, nodes, after_links, dependency_snapshots, published_by, published_at]
      properties:
        revision_number: {type: integer, minimum: 1}
        content_hash: {type: string}
        nodes:
          type: array
          items: {$ref: "#/components/schemas/RoadmapNode"}
        after_links:
          type: array
          items: {$ref: "#/components/schemas/RoadmapAfterLink"}
        dependency_snapshots:
          type: array
          items: {$ref: "#/components/schemas/RoadmapDependencySnapshot"}
        published_by: {$ref: "#/components/schemas/ActorRef"}
        published_at: {type: string, format: date-time}

    Roadmap:
      type: object
      required: [id, scope, version, plan_scope, title, lifecycle, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        scope: {type: object}
        version: {$ref: "#/components/schemas/Version"}
        plan_scope: {$ref: "#/components/schemas/RoadmapPlanScope"}
        title: {type: string}
        lifecycle:
          type: string
          enum: [open, archived]
        draft: {$ref: "#/components/schemas/RoadmapDraft"}
        revisions:
          type: array
          items: {$ref: "#/components/schemas/RoadmapRevision"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        archived_at: {type: string, format: date-time}

    RoadmapRevisionPointer:
      type: object
      required: [roadmap_id, revision_number]
      properties:
        roadmap_id: {$ref: "#/components/schemas/ID"}
        revision_number: {type: integer, minimum: 1}

    RoadmapActiveSlot:
      type: object
      required: [scope, plan_scope, roadmap_id, revision_number, activated_by, activated_at]
      properties:
        scope: {type: object}
        plan_scope: {$ref: "#/components/schemas/RoadmapPlanScope"}
        roadmap_id: {$ref: "#/components/schemas/ID"}
        revision_number: {type: integer, minimum: 1}
        activated_by: {$ref: "#/components/schemas/ActorRef"}
        activated_at: {type: string, format: date-time}

    RoadmapActivationRecord:
      type: object
      required: [id, scope, plan_scope, action, roadmap_id, revision_number, actor_ref, recorded_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        scope: {type: object}
        plan_scope: {$ref: "#/components/schemas/RoadmapPlanScope"}
        action:
          type: string
          enum: [activated, superseded, deactivated]
        roadmap_id: {$ref: "#/components/schemas/ID"}
        revision_number: {type: integer, minimum: 1}
        replacement: {$ref: "#/components/schemas/RoadmapRevisionPointer"}
        actor_ref: {$ref: "#/components/schemas/ActorRef"}
        recorded_at: {type: string, format: date-time}

    CreateRoadmapRequest:
      type: object
      additionalProperties: false
      required: [plan_scope, title]
      properties:
        plan_scope: {$ref: "#/components/schemas/RoadmapPlanScope"}
        title: {type: string}

    OpenRoadmapDraftRequest:
      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        base_revision_number: {type: integer, minimum: 1}

    ReplaceRoadmapDraftRequest:
      type: object
      additionalProperties: false
      required: [expected_draft_version]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        expected_draft_version: {type: integer, minimum: 1}
        nodes:
          type: array
          items: {$ref: "#/components/schemas/RoadmapNode"}
        after_links:
          type: array
          items: {$ref: "#/components/schemas/RoadmapAfterLink"}

    RoadmapDraftVersionRequest:
      type: object
      additionalProperties: false
      required: [expected_draft_version]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        expected_draft_version: {type: integer, minimum: 1}

    RoadmapDependencyChange:
      oneOf:
        - type: object
          additionalProperties: false
          required: [action, source_ref, target_ref, strength]
          properties:
            action: {type: string, const: add}
            source_ref: {$ref: "#/components/schemas/RelationEndpointRequest"}
            target_ref: {$ref: "#/components/schemas/RelationEndpointRequest"}
            strength: {$ref: "#/components/schemas/DependencyStrength"}
            reason: {type: string}
        - type: object
          additionalProperties: false
          required: [action, relation_id, expected_version, reason]
          properties:
            action: {type: string, const: remove}
            relation_id: {$ref: "#/components/schemas/ID"}
            expected_version: {$ref: "#/components/schemas/Version"}
            reason: {type: string, minLength: 1}

    PublishRoadmapDraftRequest:
      type: object
      additionalProperties: false
      required: [expected_draft_version]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        expected_draft_version: {type: integer, minimum: 1}
        dependency_changes:
          type: array
          maxItems: 128
          items: {$ref: "#/components/schemas/RoadmapDependencyChange"}

    CreateOutcomeRequest:
      type: object
      additionalProperties: false
      required: [title, desired_state, priority]
      properties:
        title: {type: string}
        description: {type: string}
        desired_state: {type: string}
        priority: {$ref: "#/components/schemas/Priority"}

    CreateObjectiveRequest:
      type: object
      additionalProperties: false
      required: [title, priority]
      properties:
        title: {type: string}
        description: {type: string}
        priority: {$ref: "#/components/schemas/Priority"}
        required_for_outcome: {type: boolean, default: false}
        parent_objective_id: {$ref: "#/components/schemas/ID"}

    CreateWorkItemRequest:
      type: object
      additionalProperties: false
      required: [title, priority]
      properties:
        title: {type: string}
        description: {type: string}
        priority: {$ref: "#/components/schemas/Priority"}
        lifecycle:
          type: string
          enum: [backlog, todo]
          default: backlog
        objective_id: {$ref: "#/components/schemas/ID"}
        not_before: {type: string, format: date-time}

    RelationEndpointRequest:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [objective, work_item]
        id: {$ref: "#/components/schemas/ID"}

    CreateRelationRequest:
      type: object
      additionalProperties: false
      required: [source_ref, relation_type, target_ref, strength]
      properties:
        source_ref: {$ref: "#/components/schemas/RelationEndpointRequest"}
        relation_type:
          type: string
          const: depends_on
        target_ref: {$ref: "#/components/schemas/RelationEndpointRequest"}
        strength: {$ref: "#/components/schemas/DependencyStrength"}
        satisfaction:
          $ref: "#/components/schemas/DependencySatisfaction"
        reason: {type: string}

    CreateIssueRequest:
      type: object
      additionalProperties: false
      required: [title, severity]
      properties:
        title: {type: string}
        description: {type: string}
        severity: {$ref: "#/components/schemas/IssueSeverity"}
        affected_refs:
          type: array
          items: {$ref: "#/components/schemas/EntityRefRequest"}

    UpdateIssueRequest:
      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        description: {type: string}
        severity: {$ref: "#/components/schemas/IssueSeverity"}
        affected_refs:
          type: array
          items: {$ref: "#/components/schemas/EntityRefRequest"}

    ExternalCause:
      type: object
      additionalProperties: false
      required: [provider, description]
      properties:
        provider: {type: string}
        id: {type: string}
        uri: {type: string, format: uri}
        description: {type: string}

    CreateBlockerRequest:
      type: object
      additionalProperties: false
      required: [blocked_ref]
      properties:
        blocked_ref: {$ref: "#/components/schemas/EntityRefRequest"}
        cause_ref: {$ref: "#/components/schemas/EntityRefRequest"}
        external_cause: {$ref: "#/components/schemas/ExternalCause"}
        description: {type: string}
        propagation: {$ref: "#/components/schemas/BlockerPropagation"}

    UpdateBlockerRequest:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        description: {type: string}

    ResolutionRequest:
      type: object
      additionalProperties: false
      required: [resolution_summary]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        resolution_summary: {type: string}

    MarkIssueDuplicateRequest:
      type: object
