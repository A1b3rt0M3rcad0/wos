openapi: 3.1.0
info:
  title: Woobe Outcome Server HTTP API
  version: 0.1.0-dev
  description: |
    HTTP contract implemented through Wave 07. The API exposes the same
    Application services used by embedded consumers. Namespace and Outcome
    scope are explicit in every domain path. Issues and Blockers are independent
    aggregates; compound coordination commands remain explicit and atomic.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: Health
  - name: Outcomes
  - name: Objectives
  - name: WorkItems
  - name: Relations
  - name: Issues
  - name: Blockers
  - name: Queries
  - name: Criteria

paths:
  /livez:
    get:
      tags: [Health]
      operationId: live
      responses:
        "200":
          description: Process is live.
  /readyz:
    get:
      tags: [Health]
      operationId: ready
      responses:
        "200":
          description: Storage is reachable and schema is compatible.
        "503":
          description: Server is not ready.

  /api/v1/namespaces/{namespace_id}/outcomes:
    post:
      tags: [Outcomes]
      operationId: createOutcome
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutcomeRequest"
      responses:
        "201":
          description: Outcome created or replayed idempotently.
          headers:
            ETag:
              schema: {type: string}
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}:
    get:
      tags: [Outcomes]
      operationId: getOutcome
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Persisted Outcome representation.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeReadResult"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Outcomes]
      operationId: updateOutcome
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutcomeRequest"
      responses:
        "200":
          $ref: "#/components/responses/OutcomeMutation"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/state:
    get:
      tags: [Outcomes]
      operationId: getOutcomeState
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Coherent Outcome state projection including Wave 07 blocking state.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeState"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/ready-work:
    get:
      tags: [Queries]
      operationId: listReadyWork
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: WorkItems ready at the query evaluation instant.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyWork"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/relations:
    get:
      tags: [Relations]
      operationId: listRelations
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Outcome-local relations ordered deterministically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationCollection"
    post:
      tags: [Relations]
      operationId: createRelation
      description: Wave 06 accepts the canonical depends_on relation type.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationRequest"
      responses:
        "201":
          description: Dependency relation created or replayed idempotently.
          headers:
            ETag:
              schema: {type: string}
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/relations/{relation_id}:
    get:
      tags: [Relations]
      operationId: getRelation
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/RelationID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Persisted relation representation.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationReadResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/relations/{relation_id}/actions/remove:
    post:
      tags: [Relations]
      operationId: removeRelation
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/RelationID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        $ref: "#/components/requestBodies/ReasonBody"
      responses:
        "200":
          description: Dependency relation removed while preserving history.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/actions/activate:
    post:
      tags: [Outcomes]
      operationId: activateOutcome
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        $ref: "#/components/requestBodies/VersionBody"
      responses:
        "200":
          $ref: "#/components/responses/OutcomeMutation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/actions/achieve:
    post:
      tags: [Outcomes]
      operationId: achieveOutcome
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        $ref: "#/components/requestBodies/ReasonBody"
      responses:
        "200":
          $ref: "#/components/responses/OutcomeMutation"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/actions/{outcome_action}:
    post:
      tags: [Outcomes]
      operationId: transitionOutcome
      description: |
        Lifecycle action for fail, abandon, reopen, archive or unarchive.
        Archive accepts the version body; the other actions accept a reason body.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - name: outcome_action
          in: path
          required: true
          schema:
            type: string
            enum: [fail, abandon, reopen, archive, unarchive]
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/OutcomeMutation"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/objectives:
    get:
      tags: [Objectives]
      operationId: listObjectives
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
      responses:
        "200":
          description: Objective collection for the Outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveCollection"
    post:
      tags: [Objectives]
      operationId: createObjective
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObjectiveRequest"
      responses:
        "201":
          description: Objective created or replayed idempotently.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/objectives/{objective_id}:
    get:
      tags: [Objectives]
      operationId: getObjective
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/ObjectiveID"
      responses:
        "200":
          description: Persisted Objective representation.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveReadResult"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Objectives]
      operationId: updateObjective
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/ObjectiveID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateObjectiveRequest"
      responses:
        "200":
          description: Objective updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveMutationResult"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/objectives/{objective_id}/actions/{objective_action}:
    post:
      tags: [Objectives]
      operationId: transitionObjective
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/ObjectiveID"
        - name: objective_action
          in: path
          required: true
          schema:
            type: string
            enum: [start, achieve, cancel, reopen]
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Objective transition confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items:
    get:
      tags: [WorkItems]
      operationId: listWorkItems
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
      responses:
        "200":
          description: WorkItem collection for the Outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemCollection"
    post:
      tags: [WorkItems]
      operationId: createWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkItemRequest"
      responses:
        "201":
          description: WorkItem created or replayed idempotently.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}:
    get:
      tags: [WorkItems]
      operationId: getWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
      responses:
        "200":
          description: Persisted WorkItem representation.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemReadResult"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [WorkItems]
      operationId: updateWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkItemRequest"
      responses:
        "200":
          description: WorkItem updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/operational-state:
    get:
      tags: [WorkItems]
      operationId: getWorkItemOperationalState
      description: Returns time-evaluated lease and display-state projection without mutating the WorkItem.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Current operational projection.
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemOperationalReadResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/claim:
    post:
      tags: [WorkItems]
      operationId: claimWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimWorkItemRequest"
      responses:
        "200":
          description: WorkItem claimed.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/renew-lease:
    post:
      tags: [WorkItems]
      operationId: renewWorkItemLease
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewWorkItemLeaseRequest"
      responses:
        "200":
          description: Live lease renewed without rotating claim ID or fencing token.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/reclaim:
    post:
      tags: [WorkItems]
      operationId: reclaimWorkItem
      description: Reclaims an in-progress WorkItem only after its current lease expires.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimWorkItemRequest"
      responses:
        "200":
          description: Expired lease reclaimed with a new claim ID and a higher fencing token.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/admin-cancel:
    post:
      tags: [WorkItems]
      operationId: administrativeCancelWorkItem
      description: |
        Cancels in-progress leased work without lease ownership. Requires the
        deployment authorizer to grant work:admin_cancel and a non-empty audit reason.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Leased WorkItem administratively cancelled and audited.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/admin-complete:
    post:
      tags: [WorkItems]
      operationId: administrativeCompleteWorkItem
      description: |
        Completes in-progress leased work while overriding lease ownership or expiry.
        Requires work:admin_complete. Criteria, dependency and Blocker gates remain enforced.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdministrativeCompleteWorkItemRequest"
      responses:
        "200":
          description: Leased WorkItem administratively completed and audited.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/complete:
    post:
      tags: [WorkItems]
      operationId: completeWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteWorkItemRequest"
      responses:
        "200":
          description: WorkItem completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/{work_action}:
    post:
      tags: [WorkItems]
      operationId: transitionWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - name: work_action
          in: path
          required: true
          schema:
            type: string
            enum: [activate, defer, release, cancel, reopen]
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: WorkItem transition confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/criteria:
    post:
      tags: [Criteria]
      operationId: addOutcomeCriterion
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        $ref: "#/components/requestBodies/CriterionBody"
      responses:
        "201":
          description: Criterion created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriterionMutationResult"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/{owner_collection}/{owner_id}/criteria:
    post:
      tags: [Criteria]
      operationId: addNestedCriterion
      description: Adds a criterion to an Objective or WorkItem.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - name: owner_collection
          in: path
          required: true
          schema:
            type: string
            enum: [objectives, work-items]
        - name: owner_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/ID"}
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        $ref: "#/components/requestBodies/CriterionBody"
      responses:
        "201":
          description: Criterion created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriterionMutationResult"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/issues:
    get:
      tags: [Issues]
      operationId: listIssues
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Outcome-local Issues ordered deterministically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueCollection"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Issues]
      operationId: createIssue
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Issue created or replayed idempotently.
          headers:
            ETag:
              schema: {type: string}
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMutationResult"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/issues/actions/report-with-blocker:
    post:
      tags: [Issues, Blockers]
      operationId: reportIssueWithBlocker
      description: Atomically creates an Issue and one Blocker caused by that Issue.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportIssueWithBlockerRequest"
      responses:
        "201":
          description: Both aggregates were confirmed under one outcome_revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportIssueWithBlockerMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/issues/{issue_id}:
    get:
      tags: [Issues]
      operationId: getIssue
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IssueID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Persisted Issue representation.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueReadResult"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Issues]
      operationId: updateIssue
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IssueID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: Issue details updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMutationResult"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/issues/{issue_id}/actions/{issue_action}:
    post:
      tags: [Issues]
      operationId: transitionIssue
      description: |
        Explicit lifecycle action for investigate, reopen, resolve or wont-fix.
        Investigate/reopen accept a version-only body; resolve/wont-fix require
        resolution_summary. Resolving an Issue never resolves a Blocker implicitly.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IssueID"
        - name: issue_action
          in: path
          required: true
          schema:
            type: string
            enum: [investigate, reopen, resolve, wont-fix]
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/VersionRequest"
                - $ref: "#/components/schemas/ResolutionRequest"
      responses:
        "200":
          description: Issue lifecycle transition confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/issues/{issue_id}/actions/mark-duplicate:
    post:
      tags: [Issues]
      operationId: markIssueDuplicate
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IssueID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkIssueDuplicateRequest"
      responses:
        "200":
          description: Issue marked as duplicate after cycle validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/issues/{issue_id}/actions/resolve-with-blockers:
    post:
      tags: [Issues, Blockers]
      operationId: resolveIssueAndBlockers
      description: |
        Atomically resolves one Issue and an explicit bounded list of Blockers
        caused by it. Every listed Blocker requires its own expected_version and
        release_confirmed=true. Unlisted Blockers are untouched.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IssueID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveIssueAndBlockersRequest"
      responses:
        "200":
          description: Explicit multi-aggregate resolution confirmed atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveIssueAndBlockersMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/blockers:
    get:
      tags: [Blockers]
      operationId: listBlockers
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Outcome-local Blockers ordered deterministically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerCollection"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Blockers]
      operationId: createBlocker
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlockerRequest"
      responses:
        "201":
          description: Blocker created or replayed idempotently.
          headers:
            ETag:
              schema: {type: string}
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/blockers/{blocker_id}:
    get:
      tags: [Blockers]
      operationId: getBlocker
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/BlockerID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Persisted Blocker representation.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerReadResult"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Blockers]
      operationId: updateBlocker
      description: Wave 07 allows editing the description of an active Blocker.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/BlockerID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBlockerRequest"
      responses:
        "200":
          description: Blocker description updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerMutationResult"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/blockers/{blocker_id}/actions/{blocker_action}:
    post:
      tags: [Blockers]
      operationId: closeBlocker
      description: Resolve or cancel exactly one active Blocker.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/BlockerID"
        - name: blocker_action
          in: path
          required: true
          schema:
            type: string
            enum: [resolve, cancel]
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ResolutionRequest"
                - $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Exactly one Blocker was closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockerMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

components:
  parameters:
    NamespaceID:
      name: namespace_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    OutcomeID:
      name: outcome_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    ObjectiveID:
      name: objective_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    WorkItemID:
      name: work_item_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    RelationID:
      name: relation_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    IssueID:
      name: issue_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    BlockerID:
      name: blocker_id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/ID"}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Strong ETag of the persisted aggregate, for example
        "work_item:0199e100-0000-7000-8000-000000000001:v5".
        Either If-Match or expected_version in the body is required for
        versioned mutations. If both are present they must agree.
      schema: {type: string}
    CorrelationID:
      name: X-Correlation-ID
      in: header
      required: false
      schema: {type: string}

  requestBodies:
    VersionBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VersionRequest"
    ReasonBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReasonRequest"
    CriterionBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CriterionRequest"

  responses:
    OutcomeMutation:
      description: Outcome mutation confirmed or replayed.
      headers:
        ETag:
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OutcomeMutationResult"
    BadRequest:
      description: Invalid request, identifier, JSON or header format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found in the explicit Namespace/Outcome scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Lifecycle, lease, criterion or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated principal lacks the required privileged permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PreconditionFailed:
      description: Persisted version did not satisfy the supplied precondition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PreconditionRequired:
      description: A required If-Match or expected_version precondition is absent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Request format is valid but a domain invariant is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ID:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Version:
      type: integer
      minimum: 1
    Priority:
      type: string
      enum: [critical, high, normal, low]
    OutcomeLifecycle:
      type: string
      enum: [draft, active, achieved, failed, abandoned]
    ObjectiveLifecycle:
      type: string
      enum: [planned, in_progress, achieved, cancelled]
    WorkItemLifecycle:
      type: string
      enum: [backlog, todo, in_progress, done, cancelled]
    RelationLifecycle:
      type: string
      enum: [active, removed]
    DependencyStrength:
      type: string
      enum: [hard, advisory]
    DependencySatisfaction:
      type: string
      enum: [target_completed]
    IssueSeverity:
      type: string
      enum: [critical, major, minor, informational]
    IssueLifecycle:
      type: string
      enum: [open, investigating, resolved, wont_fix, duplicate]
    BlockerLifecycle:
      type: string
      enum: [active, resolved, cancelled]
    BlockerPropagation:
      type: string
      enum: [direct, subtree]

    EntityRefRequest:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [outcome, objective, work_item, issue, blocker, relation]
        id: {$ref: "#/components/schemas/ID"}

    CreateOutcomeRequest:
      type: object
      additionalProperties: false
      required: [title, desired_state, priority]
      properties:
        title: {type: string}
        description: {type: string}
        desired_state: {type: string}
        priority: {$ref: "#/components/schemas/Priority"}

    CreateObjectiveRequest:
      type: object
      additionalProperties: false
      required: [title, priority]
      properties:
        title: {type: string}
        description: {type: string}
        priority: {$ref: "#/components/schemas/Priority"}
        required_for_outcome: {type: boolean, default: false}
        parent_objective_id: {$ref: "#/components/schemas/ID"}

    CreateWorkItemRequest:
      type: object
      additionalProperties: false
      required: [title, priority]
      properties:
        title: {type: string}
        description: {type: string}
        priority: {$ref: "#/components/schemas/Priority"}
        lifecycle:
          type: string
          enum: [backlog, todo]
          default: backlog
        objective_id: {$ref: "#/components/schemas/ID"}
        not_before: {type: string, format: date-time}

    RelationEndpointRequest:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [objective, work_item]
        id: {$ref: "#/components/schemas/ID"}

    CreateRelationRequest:
      type: object
      additionalProperties: false
      required: [source_ref, relation_type, target_ref, strength]
      properties:
        source_ref: {$ref: "#/components/schemas/RelationEndpointRequest"}
        relation_type:
          type: string
          const: depends_on
        target_ref: {$ref: "#/components/schemas/RelationEndpointRequest"}
        strength: {$ref: "#/components/schemas/DependencyStrength"}
        satisfaction:
          $ref: "#/components/schemas/DependencySatisfaction"
        reason: {type: string}

    CreateIssueRequest:
      type: object
      additionalProperties: false
      required: [title, severity]
      properties:
        title: {type: string}
        description: {type: string}
        severity: {$ref: "#/components/schemas/IssueSeverity"}
        affected_refs:
          type: array
          items: {$ref: "#/components/schemas/EntityRefRequest"}

    UpdateIssueRequest:
      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        description: {type: string}
        severity: {$ref: "#/components/schemas/IssueSeverity"}
        affected_refs:
          type: array
          items: {$ref: "#/components/schemas/EntityRefRequest"}

    ExternalCause:
      type: object
      additionalProperties: false
      required: [provider, description]
      properties:
        provider: {type: string}
        id: {type: string}
        uri: {type: string, format: uri}
        description: {type: string}

    CreateBlockerRequest:
      type: object
      additionalProperties: false
      required: [blocked_ref]
      properties:
        blocked_ref: {$ref: "#/components/schemas/EntityRefRequest"}
        cause_ref: {$ref: "#/components/schemas/EntityRefRequest"}
        external_cause: {$ref: "#/components/schemas/ExternalCause"}
        description: {type: string}
        propagation: {$ref: "#/components/schemas/BlockerPropagation"}

    UpdateBlockerRequest:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        description: {type: string}

    ResolutionRequest:
      type: object
      additionalProperties: false
      required: [resolution_summary]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        resolution_summary: {type: string}

    MarkIssueDuplicateRequest:
      type: object
      additionalProperties: false
      required: [duplicate_of_issue_id]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        duplicate_of_issue_id: {$ref: "#/components/schemas/ID"}

    ReportIssueWithBlockerRequest:
      type: object
      additionalProperties: false
      required: [issue, blocker]
      properties:
        issue:
          $ref: "#/components/schemas/CreateIssueRequest"
        blocker:
          type: object
          additionalProperties: false
          required: [blocked_ref]
          properties:
            blocked_ref: {$ref: "#/components/schemas/EntityRefRequest"}
            description: {type: string}
            propagation: {$ref: "#/components/schemas/BlockerPropagation"}

    BlockerResolutionRequest:
      type: object
      additionalProperties: false
      required: [blocker_id, expected_version, resolution_summary, release_confirmed]
      properties:
        blocker_id: {$ref: "#/components/schemas/ID"}
        expected_version: {$ref: "#/components/schemas/Version"}
        resolution_summary: {type: string}
        release_confirmed:
          type: boolean
          const: true

    ResolveIssueAndBlockersRequest:
      type: object
      additionalProperties: false
      required: [expected_issue_version, issue_resolution_summary, blockers]
      properties:
        expected_issue_version: {$ref: "#/components/schemas/Version"}
        issue_resolution_summary: {type: string}
        blockers:
          type: array
          minItems: 1
          maxItems: 64
          items: {$ref: "#/components/schemas/BlockerResolutionRequest"}

    UpdateOutcomeRequest:
      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        description: {type: string}
        desired_state: {type: string}
        priority: {$ref: "#/components/schemas/Priority"}

    UpdateObjectiveRequest:
      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        description: {type: string}
        priority: {$ref: "#/components/schemas/Priority"}
        required_for_outcome: {type: boolean}

    UpdateWorkItemRequest:
      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        description: {type: string}
        priority: {$ref: "#/components/schemas/Priority"}

    VersionRequest:
      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        reason: {type: string}

    CriterionRequest:
      type: object
      additionalProperties: false
      required: [title, required, verification_mode]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        description: {type: string}
        required: {type: boolean}
        verification_mode:
          type: string
          enum: [attestation, evidence_review, external_evaluation]

    ClaimWorkItemRequest:
      type: object
      additionalProperties: false
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        lease_ttl_seconds:
          type: integer
          minimum: 30
          maximum: 3600

    RenewWorkItemLeaseRequest:
      type: object
      additionalProperties: false
      required: [claim_id, fencing_token]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        claim_id: {$ref: "#/components/schemas/ID"}
        fencing_token:
          type: integer
          minimum: 1
        lease_ttl_seconds:
          type: integer
          minimum: 30
          maximum: 3600

    AdministrativeCompleteWorkItemRequest:
      type: object
      additionalProperties: false
      required: [result_summary, reason]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        result_summary: {type: string}
        reason: {type: string}

    CompleteWorkItemRequest:
      type: object
      additionalProperties: false
      required: [claim_id, fencing_token, reason]
      properties:
        expected_version: {$ref: "#/components/schemas/Version"}
        claim_id: {$ref: "#/components/schemas/ID"}
        fencing_token:
          type: integer
          minimum: 1
        result_summary: {type: string}
        reason: {type: string}

    ActorRef:
      type: object
      required: [kind, provider, id]
      properties:
        kind:
          type: string
          enum: [human, agent, service, automation, external_system]
        provider: {type: string}
        id: {type: string}
        display_name: {type: string}

    SuccessCriterion:
      type: object
      required: [id, owner_ref, title, required, criterion_revision, verification_mode, status]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        owner_ref: {type: object}
        title: {type: string}
        description: {type: string}
        required: {type: boolean}
        criterion_revision: {type: integer, minimum: 1}
        verification_mode:
          type: string
          enum: [attestation, evidence_review, external_evaluation]
        status:
          type: string
          enum: [active, retired]

    Outcome:
      type: object
      required: [id, namespace_id, version, title, desired_state, lifecycle, priority, criteria, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        namespace_id: {$ref: "#/components/schemas/ID"}
        version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        description: {type: string}
        desired_state: {type: string}
        lifecycle: {$ref: "#/components/schemas/OutcomeLifecycle"}
        priority: {$ref: "#/components/schemas/Priority"}
        criteria: {type: object}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Objective:
      type: object
      required: [id, scope, version, title, lifecycle, priority, required_for_outcome, criteria, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        scope: {type: object}
        version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        description: {type: string}
        lifecycle: {$ref: "#/components/schemas/ObjectiveLifecycle"}
        priority: {$ref: "#/components/schemas/Priority"}
        required_for_outcome: {type: boolean}
        criteria: {type: object}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    WorkItem:
      type: object
      required: [id, scope, version, title, lifecycle, priority, last_fencing_token, criteria, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        scope: {type: object}
        version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        description: {type: string}
        objective_id: {$ref: "#/components/schemas/ID"}
        lifecycle: {$ref: "#/components/schemas/WorkItemLifecycle"}
        priority: {$ref: "#/components/schemas/Priority"}
        not_before: {type: string, format: date-time}
        result_summary: {type: string}
        current_lease: {type: object}
        last_fencing_token: {type: integer, minimum: 0}
        criteria: {type: object}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Relation:
      type: object
      required: [id, scope, version, source_ref, relation_type, target_ref, lifecycle, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        scope: {type: object}
        version: {$ref: "#/components/schemas/Version"}
        source_ref: {type: object}
        relation_type:
          type: string
          enum: [depends_on, relates_to, produces, derived_from]
        target_ref: {type: object}
        strength: {$ref: "#/components/schemas/DependencyStrength"}
        satisfaction: {$ref: "#/components/schemas/DependencySatisfaction"}
        lifecycle: {$ref: "#/components/schemas/RelationLifecycle"}
        reason: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Issue:
      type: object
      required: [id, scope, version, title, severity, affected_refs, lifecycle, reported_by, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        scope: {type: object}
        version: {$ref: "#/components/schemas/Version"}
        title: {type: string}
        description: {type: string}
        severity: {$ref: "#/components/schemas/IssueSeverity"}
        affected_refs:
          type: array
          items: {type: object}
        lifecycle: {$ref: "#/components/schemas/IssueLifecycle"}
        reported_by: {$ref: "#/components/schemas/ActorRef"}
        resolution_summary: {type: string}
        duplicate_of_issue_id: {$ref: "#/components/schemas/ID"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    Blocker:
      type: object
      required: [id, scope, version, blocked_ref, lifecycle, propagation, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/ID"}
        scope: {type: object}
        version: {$ref: "#/components/schemas/Version"}
        blocked_ref: {type: object}
        cause_ref: {type: object}
        external_cause: {$ref: "#/components/schemas/ExternalCause"}
        description: {type: string}
        lifecycle: {$ref: "#/components/schemas/BlockerLifecycle"}
        propagation: {$ref: "#/components/schemas/BlockerPropagation"}
        resolved_at: {type: string, format: date-time}
        resolution_summary: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    AppliedBlocker:
      type: object
      required: [blocker, inherited]
      properties:
        blocker: {$ref: "#/components/schemas/Blocker"}
        inherited: {type: boolean}
        inherited_from: {type: object}

    BlockingState:
      type: object
      required: [ref, is_blocked, active_blockers]
      properties:
        ref: {type: object}
        is_blocked: {type: boolean}
        active_blockers:
          type: array
          items: {$ref: "#/components/schemas/AppliedBlocker"}

    Readiness:
      type: object
      required: [ref, ready, evaluated_at]
      properties:
        ref: {type: object}
        ready: {type: boolean}
        reasons:
          type: array
          items:
            type: string
            enum:
              - lifecycle_not_ready
              - outcome_not_active
              - outcome_archived
              - objective_terminal
              - blocked
              - hard_dependency_unsatisfied
              - not_before
              - active_lease
        evaluated_at: {type: string, format: date-time}

    WorkItemOperationalState:
      type: object
      required: [ref, lifecycle, display_state, lease_status, is_blocked, evaluated_at]
      properties:
        ref: {type: object}
        lifecycle: {$ref: "#/components/schemas/WorkItemLifecycle"}
        display_state:
          type: string
          enum: [backlog, waiting_scope, blocked, waiting_dependencies, scheduled, ready, in_progress, attention_needed, done, cancelled]
        lease_status:
          type: string
          enum: [none, active, expired]
        is_blocked: {type: boolean}
        readiness_reasons:
          type: array
          items:
            type: string
            enum:
              - lifecycle_not_ready
              - outcome_not_active
              - outcome_archived
              - objective_terminal
              - blocked
              - hard_dependency_unsatisfied
              - not_before
              - active_lease
              - lease_expired
        evaluated_at: {type: string, format: date-time}

    WorkItemOperationalReadResult:
      type: object
      required: [state, outcome_revision]
      properties:
        state: {$ref: "#/components/schemas/WorkItemOperationalState"}
        outcome_revision: {type: integer, minimum: 1}

    ReadyWorkItem:
      type: object
      required: [work_item, readiness]
      properties:
        work_item: {$ref: "#/components/schemas/WorkItem"}
        readiness: {$ref: "#/components/schemas/Readiness"}

    ReadyWork:
      type: object
      required: [items, evaluated_at, outcome_revision]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ReadyWorkItem"}
        evaluated_at: {type: string, format: date-time}
        outcome_revision: {type: integer, minimum: 1}

    MutationMetadata:
      type: object
      required: [outcome_revision, command_id, idempotent_replay]
      properties:
        outcome_revision: {type: integer, minimum: 1}
        command_id: {$ref: "#/components/schemas/ID"}
        idempotent_replay: {type: boolean}

    OutcomeMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/Outcome"}
    ObjectiveMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/Objective"}
    WorkItemMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/WorkItem"}
    CriterionMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/SuccessCriterion"}
    RelationMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/Relation"}
    IssueMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/Issue"}
    BlockerMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value: {$ref: "#/components/schemas/Blocker"}
    ReportIssueWithBlockerMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: object
              required: [issue, blocker]
              properties:
                issue: {$ref: "#/components/schemas/Issue"}
                blocker: {$ref: "#/components/schemas/Blocker"}
    ResolveIssueAndBlockersMutationResult:
      allOf:
        - $ref: "#/components/schemas/MutationMetadata"
        - type: object
          required: [value]
          properties:
            value:
              type: object
              required: [issue, blockers]
              properties:
                issue: {$ref: "#/components/schemas/Issue"}
                blockers:
                  type: array
                  items: {$ref: "#/components/schemas/Blocker"}

    OutcomeReadResult:
      type: object
      required: [value, outcome_revision]
      properties:
        value: {$ref: "#/components/schemas/Outcome"}
        outcome_revision: {type: integer, minimum: 1}
    ObjectiveReadResult:
      type: object
      required: [value, outcome_revision]
      properties:
        value: {$ref: "#/components/schemas/Objective"}
        outcome_revision: {type: integer, minimum: 1}
    WorkItemReadResult:
      type: object
      required: [value, outcome_revision]
      properties:
        value: {$ref: "#/components/schemas/WorkItem"}
        outcome_revision: {type: integer, minimum: 1}
    RelationReadResult:
      type: object
      required: [value, outcome_revision]
      properties:
        value: {$ref: "#/components/schemas/Relation"}
        outcome_revision: {type: integer, minimum: 1}
    IssueReadResult:
      type: object
      required: [value, outcome_revision]
      properties:
        value: {$ref: "#/components/schemas/Issue"}
        outcome_revision: {type: integer, minimum: 1}
    BlockerReadResult:
      type: object
      required: [value, outcome_revision]
      properties:
        value: {$ref: "#/components/schemas/Blocker"}
        outcome_revision: {type: integer, minimum: 1}

    ObjectiveCollection:
      type: object
      required: [items, outcome_revision]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Objective"}
        outcome_revision: {type: integer, minimum: 1}
    WorkItemCollection:
      type: object
      required: [items, outcome_revision]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/WorkItem"}
        outcome_revision: {type: integer, minimum: 1}
    RelationCollection:
      type: object
      required: [items, outcome_revision]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Relation"}
        outcome_revision: {type: integer, minimum: 1}
    IssueCollection:
      type: object
      required: [items, outcome_revision]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Issue"}
        outcome_revision: {type: integer, minimum: 1}
    BlockerCollection:
      type: object
      required: [items, outcome_revision]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Blocker"}
        outcome_revision: {type: integer, minimum: 1}
    OutcomeState:
      type: object
      required: [outcome, objectives, work_items, work_item_operational_states, relations, issues, blockers, blocking_states, evaluated_at, outcome_revision]
      properties:
        outcome: {$ref: "#/components/schemas/Outcome"}
        objectives:
          type: array
          items: {$ref: "#/components/schemas/Objective"}
        work_items:
          type: array
          items: {$ref: "#/components/schemas/WorkItem"}
        work_item_operational_states:
          type: array
          items: {$ref: "#/components/schemas/WorkItemOperationalState"}
        relations:
          type: array
          items: {$ref: "#/components/schemas/Relation"}
        issues:
          type: array
          items: {$ref: "#/components/schemas/Issue"}
        blockers:
          type: array
          items: {$ref: "#/components/schemas/Blocker"}
        blocking_states:
          type: array
          items: {$ref: "#/components/schemas/BlockingState"}
        evaluated_at: {type: string, format: date-time}
        outcome_revision: {type: integer, minimum: 1}

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            correlation_id: {type: string}
