openapi: 3.1.0
info:
  title: Woobe Outcome Server HTTP API
  version: 0.1.0-dev
  description: |
    HTTP contract implemented through Wave 11. The API exposes the same
    Application services used by embedded consumers. Namespace and Outcome
    scope are explicit in every domain path. Documentary records preserve
    provenance and history; Roadmap planning preserves immutable published
    revisions without duplicating operational work.
servers:
  - url: http://127.0.0.1:8080
tags:
  - name: Health
  - name: Outcomes
  - name: Objectives
  - name: WorkItems
  - name: Relations
  - name: Issues
  - name: Blockers
  - name: Artifacts
  - name: Evidence
  - name: Decisions
  - name: Queries
  - name: Criteria
  - name: Roadmaps

paths:
  /livez:
    get:
      tags: [Health]
      operationId: live
      responses:
        "200":
          description: Process is live.
  /readyz:
    get:
      tags: [Health]
      operationId: ready
      responses:
        "200":
          description: Storage is reachable and schema is compatible.
        "503":
          description: Server is not ready.

  /api/v1/namespaces/{namespace_id}/outcomes:
    post:
      tags: [Outcomes]
      operationId: createOutcome
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutcomeRequest"
      responses:
        "201":
          description: Outcome created or replayed idempotently.
          headers:
            ETag:
              schema: {type: string}
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeMutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}:
    get:
      tags: [Outcomes]
      operationId: getOutcome
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Persisted Outcome representation.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeReadResult"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Outcomes]
      operationId: updateOutcome
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutcomeRequest"
      responses:
        "200":
          $ref: "#/components/responses/OutcomeMutation"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/state:
    get:
      tags: [Outcomes]
      operationId: getOutcomeState
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Coherent Outcome state projection including Wave 07 blocking state.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeState"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/ready-work:
    get:
      tags: [Queries]
      operationId: listReadyWork
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: WorkItems ready at the query evaluation instant.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyWork"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/relations:
    get:
      tags: [Relations]
      operationId: listRelations
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Outcome-local relations ordered deterministically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationCollection"
    post:
      tags: [Relations]
      operationId: createRelation
      description: Wave 06 accepts the canonical depends_on relation type.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationRequest"
      responses:
        "201":
          description: Dependency relation created or replayed idempotently.
          headers:
            ETag:
              schema: {type: string}
            Location:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/relations/{relation_id}:
    get:
      tags: [Relations]
      operationId: getRelation
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/RelationID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Persisted relation representation.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationReadResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/relations/{relation_id}/actions/remove:
    post:
      tags: [Relations]
      operationId: removeRelation
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/RelationID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        $ref: "#/components/requestBodies/ReasonBody"
      responses:
        "200":
          description: Dependency relation removed while preserving history.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/actions/activate:
    post:
      tags: [Outcomes]
      operationId: activateOutcome
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CorrelationID"
      requestBody:
        $ref: "#/components/requestBodies/VersionBody"
      responses:
        "200":
          $ref: "#/components/responses/OutcomeMutation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/actions/achieve:
    post:
      tags: [Outcomes]
      operationId: achieveOutcome
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        $ref: "#/components/requestBodies/ReasonBody"
      responses:
        "200":
          $ref: "#/components/responses/OutcomeMutation"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/actions/{outcome_action}:
    post:
      tags: [Outcomes]
      operationId: transitionOutcome
      description: |
        Lifecycle action for fail, abandon, reopen, archive or unarchive.
        Archive accepts the version body; the other actions accept a reason body.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - name: outcome_action
          in: path
          required: true
          schema:
            type: string
            enum: [fail, abandon, reopen, archive, unarchive]
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          $ref: "#/components/responses/OutcomeMutation"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/objectives:
    get:
      tags: [Objectives]
      operationId: listObjectives
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
      responses:
        "200":
          description: Objective collection for the Outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveCollection"
    post:
      tags: [Objectives]
      operationId: createObjective
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObjectiveRequest"
      responses:
        "201":
          description: Objective created or replayed idempotently.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/objectives/{objective_id}:
    get:
      tags: [Objectives]
      operationId: getObjective
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/ObjectiveID"
      responses:
        "200":
          description: Persisted Objective representation.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveReadResult"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Objectives]
      operationId: updateObjective
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/ObjectiveID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateObjectiveRequest"
      responses:
        "200":
          description: Objective updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveMutationResult"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/objectives/{objective_id}/actions/{objective_action}:
    post:
      tags: [Objectives]
      operationId: transitionObjective
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/ObjectiveID"
        - name: objective_action
          in: path
          required: true
          schema:
            type: string
            enum: [start, achieve, cancel, reopen]
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Objective transition confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectiveMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items:
    get:
      tags: [WorkItems]
      operationId: listWorkItems
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
      responses:
        "200":
          description: WorkItem collection for the Outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemCollection"
    post:
      tags: [WorkItems]
      operationId: createWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkItemRequest"
      responses:
        "201":
          description: WorkItem created or replayed idempotently.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}:
    get:
      tags: [WorkItems]
      operationId: getWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
      responses:
        "200":
          description: Persisted WorkItem representation.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemReadResult"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [WorkItems]
      operationId: updateWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkItemRequest"
      responses:
        "200":
          description: WorkItem updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/operational-state:
    get:
      tags: [WorkItems]
      operationId: getWorkItemOperationalState
      description: Returns time-evaluated lease and display-state projection without mutating the WorkItem.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/CorrelationID"
      responses:
        "200":
          description: Current operational projection.
          headers:
            Cache-Control:
              schema: {type: string, example: no-store}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemOperationalReadResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/claim:
    post:
      tags: [WorkItems]
      operationId: claimWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimWorkItemRequest"
      responses:
        "200":
          description: WorkItem claimed.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/renew-lease:
    post:
      tags: [WorkItems]
      operationId: renewWorkItemLease
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewWorkItemLeaseRequest"
      responses:
        "200":
          description: Live lease renewed without rotating claim ID or fencing token.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/reclaim:
    post:
      tags: [WorkItems]
      operationId: reclaimWorkItem
      description: Reclaims an in-progress WorkItem only after its current lease expires.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimWorkItemRequest"
      responses:
        "200":
          description: Expired lease reclaimed with a new claim ID and a higher fencing token.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/admin-cancel:
    post:
      tags: [WorkItems]
      operationId: administrativeCancelWorkItem
      description: |
        Cancels in-progress leased work without lease ownership. Requires the
        deployment authorizer to grant work:admin_cancel and a non-empty audit reason.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Leased WorkItem administratively cancelled and audited.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/admin-complete:
    post:
      tags: [WorkItems]
      operationId: administrativeCompleteWorkItem
      description: |
        Completes in-progress leased work while overriding lease ownership or expiry.
        Requires work:admin_complete. Criteria, dependency and Blocker gates remain enforced.
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdministrativeCompleteWorkItemRequest"
      responses:
        "200":
          description: Leased WorkItem administratively completed and audited.
          headers:
            ETag:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/complete:
    post:
      tags: [WorkItems]
      operationId: completeWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteWorkItemRequest"
      responses:
        "200":
          description: WorkItem completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/work-items/{work_item_id}/actions/{work_action}:
    post:
      tags: [WorkItems]
      operationId: transitionWorkItem
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/WorkItemID"
        - name: work_action
          in: path
          required: true
          schema:
            type: string
            enum: [activate, defer, release, cancel, reopen]
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: WorkItem transition confirmed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkItemMutationResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/namespaces/{namespace_id}/outcomes/{outcome_id}/criteria:
    post:
      tags: [Criteria]
      operationId: addOutcomeCriterion
      parameters:
        - $ref: "#/components/parameters/NamespaceID"
        - $ref: "#/components/parameters/OutcomeID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        $ref: "#/components/requestBodies/CriterionBody"
      responses:
        "201":
          description: Criterion created.
