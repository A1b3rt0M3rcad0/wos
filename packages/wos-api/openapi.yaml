    OutcomeState:
      type: object
      required: [outcome, objectives, work_items, work_item_operational_states, relations, issues, blockers, artifacts, evidence, evidence_links, decisions, conclusion_contested, conclusion_contestations, blocking_states, evaluated_at, outcome_revision]
      properties:
        outcome: {$ref: "#/components/schemas/Outcome"}
        objectives:
          type: array
          items: {$ref: "#/components/schemas/Objective"}
        work_items:
          type: array
          items: {$ref: "#/components/schemas/WorkItem"}
        work_item_operational_states:
          type: array
          items: {$ref: "#/components/schemas/WorkItemOperationalState"}
        relations:
          type: array
          items: {$ref: "#/components/schemas/Relation"}
        issues:
          type: array
          items: {$ref: "#/components/schemas/Issue"}
        blockers:
          type: array
          items: {$ref: "#/components/schemas/Blocker"}
        artifacts:
          type: array
          items: {$ref: "#/components/schemas/Artifact"}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/Evidence"}
        evidence_links:
          type: array
          items: {$ref: "#/components/schemas/EvidenceLink"}
        decisions:
          type: array
          items: {$ref: "#/components/schemas/Decision"}
        conclusion_contested: {type: boolean}
        conclusion_contestations:
          type: array
          items: {$ref: "#/components/schemas/ConclusionContestation"}
        blocking_states:
          type: array
          items: {$ref: "#/components/schemas/BlockingState"}
        evaluated_at: {type: string, format: date-time}
        outcome_revision: {type: integer, minimum: 1}

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            correlation_id: {type: string}
