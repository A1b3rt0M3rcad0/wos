# Template only. Provision the operator-owned image, protected env secret,
# script/config and persistent backup destination before applying externally.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wos-backup
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1200
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: OPERATOR_REVIEWED_BACKUP_IMAGE
              command: [/opt/wos-backup/wrapper.sh]
              envFrom:
                - secretRef:
                    name: wos-backup-access
              volumeMounts:
                - name: snapshots
                  mountPath: /private/wos-backups
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: "1", memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
          volumes:
            - name: snapshots
              persistentVolumeClaim:
                claimName: wos-private-backups
