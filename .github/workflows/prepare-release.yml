name: Prepare automatic release version
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
      - name: Prepare and validate mechanical version metadata
        id: plan
        run: |
          node --test tools/releases/test.mjs
          node tools/releases/version.mjs prepare > /tmp/wos-release-plan.json
          node --test tools/releases/compatibility.test.mjs
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("/tmp/wos-release-plan.json")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${p!==null}\n`);'
      - name: Record generated metadata on a release branch
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION packages/wos-api/commands.openapi.json packages/wos-api/openapi.yaml packages/wos-cli-npm/package.json release-manifest.json docs/releases CHANGELOG.md .changes
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const changed=execFileSync('git',['diff','--cached','--name-only'],{encoding:'utf8'}).trim().split('\n');
          const fixed=new Set(['VERSION','CHANGELOG.md','release-manifest.json','packages/wos-api/commands.openapi.json','packages/wos-api/openapi.yaml','packages/wos-cli-npm/package.json']);
          assert.ok(changed.length>0);
          for(const file of changed)assert.ok(fixed.has(file)||/^\.changes\/[a-z0-9-]+\.json$/.test(file)||/^docs\/releases\/[0-9]+\.[0-9]+\.[0-9]+\.md$/.test(file),'unexpected non-metadata change: '+file);
          JS
          git commit -m "chore(release): prepare v$(cat VERSION)"
          release_branch="release/prepared-${GITHUB_SHA}"
          # Preserve master rules. Only the generated branch is written here.
          git push origin "HEAD:refs/heads/$release_branch"
          existing_pr=$(gh pr list --head "$release_branch" --base master --json url --jq '.[0].url // empty')
          if test -n "$existing_pr"; then
            echo "Prepared release PR: $existing_pr" >> "$GITHUB_STEP_SUMMARY"
          elif gh pr create --head "$release_branch" --base master \
            --title "chore(release): prepare v$(cat VERSION)" \
            --body 'Generated version metadata only. Merging this PR triggers exact-source validation and coordinated publication.' \
            > /tmp/wos-prepared-pr.out 2> /tmp/wos-prepared-pr.err; then
            cat /tmp/wos-prepared-pr.out >> "$GITHUB_STEP_SUMMARY"
          elif grep -Fq 'GitHub Actions is not permitted to create or approve pull requests' /tmp/wos-prepared-pr.err; then
            # Preparation is complete, publication is still pending integration.
            # An authorized agent can open this PR using its existing connection.
            echo "Version prepared on $release_branch; PR creation is unavailable to the Actions bot. Publication remains pending PR integration." >> "$GITHUB_STEP_SUMMARY"
          else
            cat /tmp/wos-prepared-pr.err >&2
            exit 1
          fi
