name: Wave 09 formatter

on:
  push:
    branches:
      - feat/wave-09-documentary-records

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: gofmt Wave 09 sources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/wave-09-documentary-records
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: gofmt -w .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: gofmt Wave 09 sources"
          git push origin HEAD:feat/wave-09-documentary-records
