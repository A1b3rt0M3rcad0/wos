name: CLI platform contracts
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
      - name: Execute native client, filesystem, protocol and installer acceptance
        run: node tools/distribution/platform.mjs record
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wosctl-platform-${{ matrix.os }}
          path: dist/platform-*-amd64.json
          if-no-files-found: error
