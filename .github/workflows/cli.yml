name: CLI platform contracts
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
      - name: Install native Linux Secret Service fixture
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y gnome-keyring dbus
      - name: Execute native Linux client and protected keyring acceptance
        if: runner.os == 'Linux'
        run: sh tools/acceptance/native-keyring.sh
      - name: Execute real Windows full-disk resolution recovery on an isolated VHD
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/acceptance/full-disk-cleanup.ps1
      - name: Execute native Windows client and protected Credential Manager acceptance
        if: runner.os == 'Windows'
        env:
          WOS_TEST_NATIVE_KEYRING: '1'
        run: node tools/distribution/platform.mjs record
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wosctl-platform-${{ matrix.os }}
          path: |
            dist/platform-*-amd64.json
            dist/full-disk-windows-amd64.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: wosctl-native-test-diagnostics-${{ matrix.os }}
          path: |
            dist/native-go-tests-*.jsonl
            dist/native-go-tests-*.stderr.log
          if-no-files-found: warn
