name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: WOS verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Toolchain
        run: go version

      - name: Module hygiene
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy"
            exit 1
          fi

      - name: Prepare Wave 09 branch for validation
        if: github.head_ref == 'feat/wave-09-documentary-records'
        shell: bash
        run: |
          git fetch origin feat/wave-09-documentary-records
          git checkout -B feat/wave-09-documentary-records origin/feat/wave-09-documentary-records
          gofmt -w packages tests
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages tests
            git commit -m "style: gofmt Wave 09 sources"
            git push origin HEAD:feat/wave-09-documentary-records
          fi

      - name: Formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            echo
            gofmt -d $files
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit and contract tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Build standalone binary
        run: go build -o ./bin/wos ./packages/wos-api/cmd/wos

      - name: Smoke version command
        run: ./bin/wos version

      - name: Smoke configuration validation
        run: ./bin/wos config validate

      - name: Smoke standalone HTTP runtime
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          log="$tmpdir/wos.log"
          WOS_LISTEN=127.0.0.1:18080 \
          WOS_SQLITE_PATH="$tmpdir/wos.db" \
          WOS_LOCAL_PRINCIPAL_ID=ci-local \
            ./bin/wos server >"$log" 2>&1 &
          pid=$!

          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/readyz >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 0.2
          done

          if [ "$ready" -ne 1 ]; then
            cat "$log"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:18080/livez >/dev/null
