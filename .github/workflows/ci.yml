name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: WOS verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: wos_ci
          POSTGRES_DB: wos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WOS_TEST_POSTGRES_DSN: postgres://postgres:wos_ci@localhost:5432/wos_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Toolchain
        run: go version

      - name: Module hygiene
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy"
            exit 1
          fi

      - name: Formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            echo
            gofmt -d $files
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Generated adapters and MCP commands are current
        run: |
          python3 tools/postgresgen/generate.py
          go run ./tools/mcpgen
          go run ./tools/openapigen
          gofmt -w packages/wos-core/storage/postgres packages/wos-api/mcp packages/wos-api/commands packages/wos-sdk-go
          git diff --exit-code -- packages/wos-core/storage/postgres packages/wos-api/mcp packages/wos-api/commands packages/wos-sdk-go packages/wos-api/commands.openapi.json

      - name: Unit and contract tests
        env:
          WOS_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: go test ./...

      - name: Race detector
        env:
          WOS_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: go test -race ./...

      - name: Build standalone binary
        run: go build -o ./bin/wos ./packages/wos-api/cmd/wos

      - name: Smoke version command
        run: ./bin/wos version

      - name: Smoke configuration validation
        run: ./bin/wos config validate

      - name: Smoke standalone HTTP runtime
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          log="$tmpdir/wos.log"
          WOS_LISTEN=127.0.0.1:18080 \
          WOS_SQLITE_PATH="$tmpdir/wos.db" \
          WOS_LOCAL_PRINCIPAL_ID=ci-local \
            ./bin/wos server >"$log" 2>&1 &
          pid=$!

          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/readyz >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 0.2
          done

          if [ "$ready" -ne 1 ]; then
            cat "$log"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:18080/livez >/dev/null
