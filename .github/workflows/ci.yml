name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: WOS verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: wos_ci
          POSTGRES_DB: wos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WOS_TEST_POSTGRES_DSN: postgres://postgres:wos_ci@localhost:5432/wos_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Toolchain
        run: go version

      - name: Module hygiene
        shell: bash
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "go.mod/go.sum are not tidy"
            exit 1
          fi

      - name: Formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            echo
            gofmt -d $files
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Generated adapters and MCP commands are current
        run: |
          python3 tools/signedgen/generate.py
          gofmt -w packages/wos-core/storage/memory/signed_work_contracts.go packages/wos-core/storage/sqlite/signed_work_contracts.go
          python3 tools/postgresgen/generate.py
          go run ./tools/mcpgen
          go run ./tools/openapigen
          gofmt -w packages/wos-core/storage/postgres packages/wos-api/mcp packages/wos-api/commands packages/wos-sdk-go
          git diff --exit-code -- packages/wos-core/storage/memory/signed_work_contracts.go packages/wos-core/storage/sqlite/signed_work_contracts.go packages/wos-core/storage/postgres packages/wos-api/mcp packages/wos-api/commands packages/wos-sdk-go packages/wos-api/commands.openapi.json
          python3 tools/eventcatalog/check.py

      - name: Controlled context/cost report validation
        run: |
          python3 tools/acceptance/context-cost-report-test.py
          python3 tools/acceptance/scenario-execution-report-test.py

      - name: Unit and contract tests
        env:
          WOS_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          if go test -json ./... > unit-contract-tests.jsonl; then
            echo 'Unit/contract execution recorded'
          else
            status=$?
            cat unit-contract-tests.jsonl
            exit "$status"
          fi

      - name: Race detector
        env:
          WOS_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          if go test -json -race ./... > race-tests.jsonl; then
            echo 'Race execution recorded'
          else
            status=$?
            cat race-tests.jsonl
            exit "$status"
          fi

      - name: Active signed codec and restricted YAML fuzz campaigns
        shell: bash
        run: |
          go test -json -run '^$' -fuzz '^FuzzCanonical$' -fuzztime=10s -parallel=2 ./packages/wos-core/signing > signing-canonical-fuzz.jsonl
          go test -json -run '^$' -fuzz '^FuzzEnvelope$' -fuzztime=10s -parallel=2 ./packages/wos-core/signing > signing-envelope-fuzz.jsonl
          go test -json -run '^$' -fuzz '^FuzzYAMLJSON$' -fuzztime=10s -parallel=2 ./packages/wos-cli > restricted-yaml-fuzz.jsonl
          python3 tools/acceptance/fuzz-report.py "$(git rev-parse HEAD)" signing-canonical-fuzz.jsonl signing-envelope-fuzz.jsonl restricted-yaml-fuzz.jsonl signed-fuzz.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-active-fuzz
          path: |
            signed-fuzz.json
            signing-canonical-fuzz.jsonl
            signing-envelope-fuzz.jsonl
            restricted-yaml-fuzz.jsonl
          if-no-files-found: error
      - name: Real full-disk receipt cleanup
        run: |
          set -o pipefail
          bash tools/acceptance/full-disk-cleanup.sh | tee full-disk-cleanup.log
          test "$(grep -c '^--- PASS: TestReceiptCleanupRecoversRealFullDisk' full-disk-cleanup.log)" = 1
          go tool test2json -t -p github.com/A1b3rt0M3rcad0/wos/packages/wos-cli < full-disk-cleanup.log > full-disk-cleanup.jsonl

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-full-disk-cleanup
          path: |
            full-disk-cleanup.log
            full-disk-cleanup.jsonl
          if-no-files-found: error

      - name: Build standalone binary
        run: go build -o ./bin/wos ./packages/wos-api/cmd/wos

      - name: Actual v0.2 database upgrade, clean restore and old writer refusal
        env:
          WOS_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          historical_ref=b75aa3e0ca6d649cafadf8450d9b5d606367dda4
          git fetch --no-tags --depth=1 origin "$historical_ref"
          historical_source="$(mktemp -d)"
          trap 'rm -rf "$historical_source"' EXIT
          git archive "$historical_ref" | tar -x -C "$historical_source"
          historical_built_at="$(git show -s --format=%cI "$historical_ref")"
          (cd "$historical_source" && go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/A1b3rt0M3rcad0/wos/packages/wos-api/internal/server.Version=0.2.0 -X github.com/A1b3rt0M3rcad0/wos/packages/wos-api/internal/server.Commit=$historical_ref -X github.com/A1b3rt0M3rcad0/wos/packages/wos-api/internal/server.BuiltAt=$historical_built_at" \
            -o "$historical_source/wos-v020" ./packages/wos-api/cmd/wos)
          current_ref="$(git rev-parse HEAD)"
          go build -trimpath -buildvcs=false \
            -ldflags "-X github.com/A1b3rt0M3rcad0/wos/packages/wos-api/internal/server.Version=$(cat VERSION) -X github.com/A1b3rt0M3rcad0/wos/packages/wos-api/internal/server.Commit=$current_ref" \
            -o ./bin/wos-upgrade-test ./packages/wos-api/cmd/wos
          python3 tests/acceptance/historical_upgrade.py --binary bin/wos-upgrade-test \
            --old-binary "$historical_source/wos-v020" --source "$current_ref" --report historical-upgrade.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: historical-v020-upgrade
          path: historical-upgrade.json

      - name: Smoke version command
        run: ./bin/wos version

      - name: Smoke configuration validation
        run: ./bin/wos config validate

      - name: Same-Outcome eighteen-step standalone acceptance
        run: python3 tests/acceptance/journey.py --binary bin/wos --client http

      - name: Reproducible Linux amd64 build across source paths
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          mkdir "$tmpdir/source"
          git archive HEAD | tar -x -C "$tmpdir/source"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$tmpdir/first" ./packages/wos-api/cmd/wos
          (cd "$tmpdir/source" && CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$tmpdir/second" ./packages/wos-api/cmd/wos)
          cmp "$tmpdir/first" "$tmpdir/second"
          sha256sum "$tmpdir/first" "$tmpdir/second"

      - name: Non-root container build and runtime smoke
        shell: bash
        run: |
          docker compose --env-file .env.example config --quiet
          docker build --tag wos:ci .
          test "$(docker inspect --format '{{.Config.User}}' wos:ci)" = '10001:10001'
          docker run --rm wos:ci version
          docker run --rm wos:ci config validate
          bootstrap="$(openssl rand -base64 32)"
          echo "::add-mask::$bootstrap"
          docker run -d --name wos-ci --read-only --tmpfs /data:uid=10001,gid=10001,mode=0700 \
            -p 127.0.0.1:18081:8080 \
            --env WOS_LISTEN=0.0.0.0:8080 --env WOS_AUTH_MODE=api_token \
            --env WOS_BOOTSTRAP_TOKEN="$bootstrap" \
            --env WOS_BOOTSTRAP_NAMESPACE_ID=0199d220-0000-7000-8000-000000000001 \
            --env WOS_BOOTSTRAP_NAMESPACE_NAME=Container-ci --env WOS_LOCAL_PRINCIPAL_ID=container-ci \
            wos:ci
          trap 'docker rm -f wos-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:18081/readyz >/dev/null; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs wos-ci
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:18081/livez >/dev/null

      - name: Measure bounded work-contract contention and context
        env:
          WOS_CONTRACT_LOAD: '1'
        shell: bash
        run: |
          go test -count=1 -v ./packages/wos-core/storage/sqlite ./packages/wos-core/storage/postgres -run '^TestWorkContractLoadMatrix$' | tee work-contract-load.log
          python3 tools/acceptance/load-report.py work-contract-load.log "$(git rev-parse HEAD)" work-contract-load.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: work-contract-load
          path: work-contract-load.json

      - name: Measure signed work and independent review contention
        env:
          WOS_SIGNED_LOAD: '1'
        shell: bash
        run: |
          go test -count=1 -json ./packages/wos-core/storage/sqlite ./packages/wos-core/storage/postgres -run '^TestSignedWorkReviewLoadMatrix$' > signed-work-review-load.jsonl
          python3 tools/acceptance/signed-load-report.py signed-work-review-load.jsonl "$(git rev-parse HEAD)" signed-work-review-load.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: signed-work-review-load
          path: |
            signed-work-review-load.json
            signed-work-review-load.jsonl
          if-no-files-found: error

      - name: Smoke standalone HTTP runtime
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          log="$tmpdir/wos.log"
          WOS_LISTEN=127.0.0.1:18080 \
          WOS_SQLITE_PATH="$tmpdir/wos.db" \
          WOS_LOCAL_PRINCIPAL_ID=ci-local \
            ./bin/wos server >"$log" 2>&1 &
          pid=$!

          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/readyz >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 0.2
          done

          if [ "$ready" -ne 1 ]; then
            cat "$log"
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:18080/livez >/dev/null

      - name: Bind T01-T96 mappings to actual execution
        run: python3 tools/acceptance/scenario-execution-report.py "$(git rev-parse HEAD)" scenario-execution.json unit-contract-tests.jsonl race-tests.jsonl signed-work-review-load.jsonl full-disk-cleanup.jsonl
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: signed-scenario-execution
          path: |
            scenario-execution.json
            unit-contract-tests.jsonl
            race-tests.jsonl
          if-no-files-found: warn
