name: Publish native WOS CLI npm 0.4.0
on:
  push:
    branches: [master]
    paths: [release-manifest.json, packages/wos-cli-npm/package.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-native-wos-cli
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.version.outputs.eligible }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: version
        shell: bash
        run: |
          if [ "$(cat VERSION)" = 0.4.0 ] && [ "$(node -p 'require("./release-manifest.json").version')" = 0.4.0 ]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi
  core:
    needs: select
    if: needs.select.outputs.eligible == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ github.sha }}
  browser:
    needs: select
    if: needs.select.outputs.eligible == 'true'
    uses: ./.github/workflows/web.yml
    with:
      source_ref: ${{ github.sha }}
  packages:
    needs: select
    if: needs.select.outputs.eligible == 'true'
    uses: ./.github/workflows/packages.yml
    with:
      source_ref: ${{ github.sha }}
  client:
    needs: select
    if: needs.select.outputs.eligible == 'true'
    uses: ./.github/workflows/cli.yml
    with:
      source_ref: ${{ github.sha }}
  publish:
    needs: [select, core, browser, packages, client]
    if: needs.select.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
      - name: Pin npm packaging client
        run: npm install --global npm@11.9.0 --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wosctl-platform-*
          path: dist/acceptance
          merge-multiple: true
      - name: Build and verify native Go CLI distribution
        run: |
          node tools/distribution/build.mjs
          node tools/distribution/verify.mjs
      - name: Publish/reconcile only CLI npm artifact
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          WOS_CLI_PUBLISH: '1'
        run: node tools/releases/publish-cli-npm.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: npm-cli-publication-${{ github.sha }}
          path: |
            dist/npm-publication.json
            dist/npm-publication-pending.json
            dist/wosctl-*.tgz
            dist/distribution.json
            dist/SHA256SUMS
          if-no-files-found: error
  published-consumer:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
      - name: Install the public latest package and exercise native skills
        env:
          WOS_PUBLISHED_VERSION: '0.4.0'
          WOS_EXPECTED_COMMIT: ${{ github.sha }}
        run: node tools/distribution/published-consumer.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: published-wosctl-${{ matrix.os }}
          path: dist/published-consumer-*.json
          if-no-files-found: error
