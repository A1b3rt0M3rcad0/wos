name: Release WOS and skills
on:
  push:
    branches: [master]
    paths: [release-manifest.json]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish verified immutable assets to npm, GHCR and GitHub Release'
        required: false
        type: boolean
        default: false
      source_sha:
        description: 'Full original master commit to resume; blank uses current master'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: publish-wos
  cancel-in-progress: false
jobs:
  source:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}
      - id: source
        run: |
          git merge-base --is-ancestor HEAD origin/master
          test -f release-manifest.json
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  core:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
  browser:
    needs: source
    uses: ./.github/workflows/web.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
  packages:
    needs: source
    uses: ./.github/workflows/packages.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
  client:
    needs: source
    uses: ./.github/workflows/cli.yml
    with:
      source_ref: ${{ needs.source.outputs.sha }}
  verify:
    needs: [source, core, browser, packages, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
      - name: Pin packaging npm
        run: npm install --global npm@11.9.0 --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wosctl-platform-*
          path: dist/acceptance
          merge-multiple: true
      - name: Verify coordinated immutable source, packages and native receipts
        run: |
          node tools/distribution/build.mjs
          node tools/distribution/verify.mjs > dist/package-acceptance.json
          node --input-type=module -e 'import fs from "node:fs/promises"; import {verifyNativePlatforms} from "./tools/distribution/platform.mjs"; const manifest=JSON.parse(await fs.readFile("dist/distribution.json","utf8")); await verifyNativePlatforms(manifest); console.log(JSON.stringify({source:manifest.commit,version:manifest.version,native_receipts_verified:true}));' > dist/native-verification.json
          node tools/releases/publish.mjs --dry-run > dist/release-verification.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-coordinated-release
          path: |
            dist/*.tgz
            dist/*.tar.gz
            dist/*.zip
            dist/distribution.json
            dist/SHA256SUMS
            dist/package-acceptance.json
            dist/release-verification.json
            dist/native-verification.json
            dist/acceptance/*.json
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    needs: [source, core, browser, packages, client, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
      - name: Pin npm publishing client
        run: npm install --global npm@11.9.0 --ignore-scripts
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wosctl-platform-*
          path: dist/acceptance
          merge-multiple: true
      - name: Build verified immutable assets
        run: |
          node tools/distribution/build.mjs
          node tools/distribution/verify.mjs
          node tools/releases/publish.mjs --dry-run
      - name: Build and smoke versioned OCI image
        run: |
          version=$(node -p 'require("./dist/distribution.json").version')
          built=$(node -p 'require("./dist/distribution.json").built_at')
          commit=$(git rev-parse HEAD)
          docker build --tag wos:release-tested --build-arg "WOS_VERSION=$version" --build-arg "WOS_COMMIT=$commit" --build-arg "WOS_BUILT_AT=$built" .
          test "$(docker inspect --format '{{.Config.User}}' wos:release-tested)" = '10001:10001'
          docker run --rm wos:release-tested version
          docker run --rm wos:release-tested config validate
          node tools/distribution/container.mjs
      - name: Authenticate GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish or reconcile npm, GHCR and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_AUTH_MODE: ${{ vars.NPM_AUTH_MODE }}
          NPM_PROVENANCE: ${{ vars.NPM_PROVENANCE }}
          WOS_RELEASE_PUBLISH: '1'
        run: |
          if [ "$NPM_PROVENANCE" = true ] && [ '${{ github.event.repository.private }}' = true ]; then
            echo 'npm provenance requires a supported public source repository; keep this private repository unchanged and disable this optional flag.'
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] && { [ "$NPM_AUTH_MODE" = oidc ] || [ "$NPM_PROVENANCE" = true ]; }; then
            echo 'Historical-source retry must use token publication without provenance; the current workflow identity describes another commit.'
            exit 1
          fi
          if [ "$NPM_AUTH_MODE" = oidc ]; then
            unset NODE_AUTH_TOKEN
          fi
          node tools/releases/publish.mjs
