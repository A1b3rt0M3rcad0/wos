services:
  wos:
    build: .
    ports:
      - "127.0.0.1:${WOS_HTTP_PORT:-8080}:8080"
    environment:
      WOS_LISTEN: 0.0.0.0:8080
      WOS_HTTP_READ_HEADER_TIMEOUT: ${WOS_HTTP_READ_HEADER_TIMEOUT:-5s}
      WOS_HTTP_READ_TIMEOUT: ${WOS_HTTP_READ_TIMEOUT:-30s}
      WOS_HTTP_REQUEST_TIMEOUT: ${WOS_HTTP_REQUEST_TIMEOUT:-15s}
      WOS_HTTP_WRITE_TIMEOUT: ${WOS_HTTP_WRITE_TIMEOUT:-45s}
      WOS_HTTP_IDLE_TIMEOUT: ${WOS_HTTP_IDLE_TIMEOUT:-60s}
      WOS_HTTP_MAX_HEADER_BYTES: ${WOS_HTTP_MAX_HEADER_BYTES:-65536}
      WOS_HTTP_MAX_INFLIGHT_REQUESTS: ${WOS_HTTP_MAX_INFLIGHT_REQUESTS:-128}
      WOS_MAX_CONNECTIONS: ${WOS_MAX_CONNECTIONS:-256}
      WOS_SHUTDOWN_TIMEOUT: ${WOS_SHUTDOWN_TIMEOUT:-15s}
      WOS_DELIVERY_BACKLOG_MAX_AGE: ${WOS_DELIVERY_BACKLOG_MAX_AGE:-5m}
      WOS_AUTH_MODE: api_token
      WOS_LOCAL_PRINCIPAL_ID: ${WOS_LOCAL_PRINCIPAL_ID:-operator}
      WOS_BOOTSTRAP_TOKEN: ${WOS_BOOTSTRAP_TOKEN:?set a random bootstrap token of at least 32 characters}
      WOS_BOOTSTRAP_NAMESPACE_ID: ${WOS_BOOTSTRAP_NAMESPACE_ID:?set a UUIDv7 namespace}
      WOS_BOOTSTRAP_NAMESPACE_NAME: ${WOS_BOOTSTRAP_NAMESPACE_NAME:-Main}
      WOS_STORAGE_DRIVER: ${WOS_STORAGE_DRIVER:-sqlite}
      WOS_POSTGRES_DSN: ${WOS_POSTGRES_DSN:-}
      WOS_MCP_ENABLED: ${WOS_MCP_ENABLED:-true}
      WOS_SERVER_SIGNING_SEED_ENV: ${WOS_SERVER_SIGNING_SEED_ENV:-}
      WOS_SERVER_SIGNING_SEED: ${WOS_SERVER_SIGNING_SEED:-}
      WOS_SIGNED_ACCEPTANCE_FLOOR: ${WOS_SIGNED_ACCEPTANCE_FLOOR:-direct}
    volumes:
      - wos_data:/data
    restart: unless-stopped
  postgres:
    image: postgres:18
    profiles: [postgres]
    environment:
      POSTGRES_DB: wos
      POSTGRES_USER: wos
      POSTGRES_PASSWORD: ${WOS_POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wos -d wos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  wos_data:
  postgres_data:
